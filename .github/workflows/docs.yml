name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full git history, needed for page dates and authors
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      # remove when Zensical supports git dates natively
      - run: python scripts/git_info.py docs
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
